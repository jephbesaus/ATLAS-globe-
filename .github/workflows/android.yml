name: Construire l'APK Atlas Globe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Télécharger le moteur sing-box officiel (arm64 et armv7)
        env:
          SB_VERSION: "1.13.14"
        run: |
          set -e
          for pair in "arm64:arm64-v8a" "armv7:armeabi-v7a"; do
            arch="${pair%%:*}"; abi="${pair##*:}"
            f="sing-box-${SB_VERSION}-android-${arch}.tar.gz"
            curl -fL --retry 3 -o "$f" "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/${f}"
            mkdir -p "app/src/main/jniLibs/${abi}" "tmp-${arch}"
            tar -xzf "$f" -C "tmp-${arch}"
            bin=$(find "tmp-${arch}" -type f -name sing-box | head -n1)
            cp "$bin" "app/src/main/jniLibs/${abi}/libsingbox.so"
            chmod 755 "app/src/main/jniLibs/${abi}/libsingbox.so"
          done
          ls -la app/src/main/jniLibs/*/

      - name: Compiler
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Résumé des erreurs (visible dans l'onglet Summary)
        if: failure()
        run: |
          echo '## Erreurs de compilation' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |error:|What went wrong' -A2 build.log | head -150 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-compilation
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: AtlasGlobe-APK
          path: app/build/outputs/apk/debug/*.apk
